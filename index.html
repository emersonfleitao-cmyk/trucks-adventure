<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trucks Adventure</title>
<style>
body {
  margin:0;
  background:#17212b;
  color:white;
  font-family:Arial;
  text-align:center;
}
h1 {color:#ffc107}
canvas {
  width:96%;
  max-width:800px;
  background:#8ed8ff;
  border:3px solid white;
  touch-action:manipulation;
}
button {
  padding:18px 45px;
  margin:15px;
  border:0;
  border-radius:12px;
  background:#ffc107;
  font-size:22px;
  font-weight:bold;
}
</style>
</head>
<body>

<h1>🚛 TRUCKS ADVENTURE</h1>
<p>Desvie dos obstáculos!</p>

<canvas id="game" width="800" height="350"></canvas>
<br>
<button id="jump">PULAR</button>
<h2 id="score">Pontos: 0</h2>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");

let truck={x:100,y:245,vy:0,ground:true};
let obstacles=[];
let score=0;
let speed=6;
let frame=0;
let running=true;

function jump(){
 if(!running){
  truck.y=245;
  truck.vy=0;
  truck.ground=true;
  obstacles=[];
  score=0;
  speed=6;
  frame=0;
  running=true;
  document.getElementById("jump").textContent="PULAR";
  loop();
  return;
 }
 if(truck.ground){
  truck.vy=-15;
  truck.ground=false;
 }
}

document.getElementById("jump").onclick=jump;
c.addEventListener("pointerdown",jump);

function drawTruck(){
 ctx.fillStyle="#e53935";
 ctx.fillRect(truck.x,truck.y,90,35);
 ctx.fillStyle="#1565c0";
 ctx.fillRect(truck.x+55,truck.y-25,35,25);
 ctx.fillStyle="#222";
 ctx.beginPath();
 ctx.arc(truck.x+20,truck.y+38,10,0,7);
 ctx.arc(truck.x+72,truck.y+38,10,0,7);
 ctx.fill();
}

function loop(){
 if(!running)return;

 ctx.clearRect(0,0,800,350);

 ctx.fillStyle="#55a630";
 ctx.fillRect(0,300,800,50);

 ctx.fillStyle="#fff";
 ctx.fillRect(0,315,800,5);

 truck.y+=truck.vy;
 truck.vy+=0.7;

 if(truck.y>=245){
  truck.y=245;
  truck.vy=0;
  truck.ground=true;
 }

 drawTruck();

 frame++;
 if(frame%95===0){
  obstacles.push({x:800,y:265});
 }

 ctx.fillStyle="#333";

 obstacles.forEach(o=>{
  o.x-=speed;
  ctx.fillRect(o.x,o.y,30,35);

  if(truck.x+85>o.x &&
     truck.x+10<o.x+30 &&
     truck.y+35>o.y){
   running=false;
  }
 });

 obstacles=obstacles.filter(o=>o.x>-40);

 score++;
 speed+=0.001;

 document.getElementById("score").textContent=
 "Pontos: "+Math.floor(score/5);

 if(!running){
  ctx.fillStyle="#b71c1c";
  ctx.font="bold 48px Arial";
  ctx.fillText("GAME OVER",270,150);
  document.getElementById("jump").textContent="RECOMEÇAR";
  return;
 }

 requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
